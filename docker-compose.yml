version: '3.8'
services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    ports: ["5000:5000"]
    env_file: backend/.env
    depends_on: [db]
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "GymerSecure123!"
    ports: ["1433:1433"]
    volumes: [db-data:/var/opt/mssql]
    restart: unless-stopped
volumes:
  db-data:
